<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 캠퍼스 모험 이야기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --ink:#1a1730;
    --cream:#fff7ec;
    --paper:#fffdf8;
    --shadow:rgba(26,23,48,.18);
    --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font);
    background:var(--cream);
    color:var(--ink);
    overflow-x:hidden;
    line-height:1.65;
    font-weight:500;
    -webkit-font-smoothing:antialiased;
  }

  /* ====== 떠다니는 배경 도형 ====== */
  .bg-deco{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:42% 58% 60% 40% / 45% 45% 55% 55%;opacity:.32;filter:blur(2px);}
  .b1{width:280px;height:280px;background:#ffd36b;top:-60px;left:-60px;animation:float1 14s ease-in-out infinite;}
  .b2{width:220px;height:220px;background:#9be3c4;bottom:-40px;right:-40px;animation:float2 16s ease-in-out infinite;}
  .b3{width:160px;height:160px;background:#ffb3c7;top:40%;right:8%;animation:float1 12s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(12deg)}}
  @keyframes float2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(26px) rotate(-10deg)}}

  /* ====== 공통 래퍼 ====== */
  .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 18px;}

  /* ====== 인트로 ====== */
  header.hero{text-align:center;padding:60px 18px 30px;position:relative;z-index:1;}
  .badge{
    display:inline-block;background:var(--ink);color:#fff;
    font-size:.95rem;padding:7px 18px;border-radius:30px;margin-bottom:18px;
    letter-spacing:.3px;font-weight:600;
  }
  .hero h1{
    font-size:clamp(2.2rem,7.5vw,3.8rem);
    line-height:1.15;letter-spacing:-1.2px;font-weight:800;
  }
  .hero h1 .pop{color:#e8344e;display:inline-block;animation:wiggle 3s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .hero p{font-size:clamp(1rem,3.2vw,1.25rem);margin-top:16px;color:#5a5470;font-weight:500;}
  .hint{
    margin-top:26px;font-size:1.05rem;color:#9b93b0;font-weight:600;
  }
  .hint .arrow{display:inline-block;animation:bounce 1.6s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

  /* ====== 과정 카드 그리드 ====== */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:22px;padding:30px 0 60px;
  }
  .card{
    background:var(--paper);border-radius:26px;padding:28px 24px;cursor:pointer;
    border:3px solid var(--ink);
    box-shadow:7px 8px 0 var(--ink);
    transition:transform .18s ease,box-shadow .18s ease;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:10px;background:var(--c);
  }
  .card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:11px 13px 0 var(--ink);outline:none;}
  .card:active{transform:translate(2px,3px);box-shadow:4px 4px 0 var(--ink);}
  .card .emoji{font-size:3.4rem;display:block;margin-bottom:6px;line-height:1;}
  .card .role{
    display:inline-block;background:var(--c);color:#fff;font-size:.85rem;
    padding:4px 12px;border-radius:20px;margin-bottom:10px;font-weight:700;
  }
  .card h2{font-size:1.4rem;margin-bottom:4px;font-weight:800;letter-spacing:-.5px;}
  .card .eng{color:#9b93b0;font-size:.92rem;margin-bottom:12px;font-weight:600;}
  .card .blurb{font-size:1rem;color:#4d4763;font-weight:500;}
  .card .go{
    margin-top:16px;font-weight:700;color:var(--c);font-size:1.02rem;
    display:flex;align-items:center;gap:6px;
  }
  .card .go span{transition:transform .2s;}
  .card:hover .go span{transform:translateX(6px);}

  /* ====== 상세(스토리) 화면 ====== */
  .story{
    display:none;position:relative;z-index:1;min-height:100vh;
    padding-bottom:90px;animation:fadeUp .45s ease;
  }
  .story.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  .topbar{
    position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);
    background:color-mix(in srgb,var(--cream) 80%,transparent);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    border-bottom:2px dashed #d8d0c0;
  }
  .back{
    background:var(--ink);color:#fff;border:none;cursor:pointer;
    font-family:var(--font);font-size:.98rem;font-weight:600;
    padding:9px 18px;border-radius:30px;
    display:flex;align-items:center;gap:6px;transition:transform .15s;
  }
  .back:hover{transform:translateX(-4px);}
  .topbar .tname{font-weight:700;font-size:1.02rem;}

  .story-hero{text-align:center;padding:46px 18px 10px;}
  .story-hero .bigemoji{
    font-size:5.5rem;display:inline-block;animation:hop 2.4s ease-in-out infinite;
    filter:drop-shadow(4px 6px 0 var(--shadow));
  }
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
  .story-hero .role{
    display:inline-block;background:var(--c);color:#fff;padding:5px 16px;
    border-radius:24px;font-size:.95rem;margin:14px 0 6px;font-weight:700;
  }
  .story-hero h2{font-size:clamp(1.9rem,6.5vw,2.8rem);font-weight:800;letter-spacing:-1px;}
  .story-hero .sub{color:#9b93b0;font-size:1rem;font-weight:600;}

  .intro-box{
    background:var(--paper);border:3px solid var(--ink);border-radius:22px;
    padding:26px 24px;margin:24px 0;box-shadow:6px 7px 0 var(--ink);font-size:1.1rem;
    position:relative;font-weight:500;line-height:1.75;
  }
  .intro-box .tag{
    position:absolute;top:-14px;left:20px;background:var(--c);color:#fff;
    padding:3px 14px;border-radius:16px;font-size:.85rem;font-weight:700;
  }
  .intro-box b{color:var(--c);font-weight:700;}

  /* ====== 여정(타임라인) ====== */
  .journey-title{
    text-align:center;font-size:1.6rem;margin:40px 0 10px;font-weight:800;letter-spacing:-.5px;
  }
  .journey-title small{display:block;color:#9b93b0;font-size:.98rem;font-weight:500;margin-top:4px;}

  .step{
    background:var(--paper);border:3px solid var(--ink);border-radius:22px;
    margin:18px 0;overflow:hidden;box-shadow:5px 6px 0 var(--ink);
  }
  .step-head{
    display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;
    user-select:none;
  }
  .step-num{
    flex:none;width:46px;height:46px;border-radius:50%;background:var(--c);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:1.25rem;font-weight:800;box-shadow:2px 3px 0 var(--ink);
  }
  .step-head .st-emoji{font-size:1.8rem;flex:none;}
  .step-head .st-title{flex:1;}
  .step-head .st-title strong{font-size:1.18rem;display:block;font-weight:700;letter-spacing:-.3px;}
  .step-head .st-title em{font-style:normal;color:#9b93b0;font-size:.9rem;font-weight:600;}
  .step-head .chev{flex:none;font-size:1.4rem;color:var(--c);transition:transform .25s;}
  .step.open .chev{transform:rotate(180deg);}

  .step-body{
    max-height:0;overflow:hidden;transition:max-height .45s ease;
    padding:0 20px;
  }
  .step.open .step-body{max-height:1400px;padding-bottom:22px;}
  .step-body .story-line{
    font-size:1.08rem;margin-bottom:14px;padding-top:6px;font-weight:500;line-height:1.75;
  }
  .learn{
    background:var(--soft);border-radius:16px;padding:15px 17px;
    font-size:1.02rem;font-weight:500;
  }
  .learn .lh{display:flex;align-items:center;gap:6px;color:var(--c);margin-bottom:6px;font-weight:700;}
  .learn ul{list-style:none;}
  .learn li{padding:3px 0 3px 22px;position:relative;}
  .learn li::before{content:"⭐";position:absolute;left:0;font-size:.85rem;}

  /* ====== 원본 출처 박스 ====== */
  .source{
    margin-top:14px;border:2px dashed #c9c0b0;border-radius:16px;
    padding:14px 16px;background:#fbf6ee;
  }
  .source .sh{
    display:flex;align-items:center;gap:6px;color:#8a8273;
    font-size:.9rem;margin-bottom:8px;font-weight:700;
  }
  .source ul{list-style:none;}
  .source li{
    padding:8px 0;border-top:1px solid #ece4d6;font-size:.94rem;color:#5a5345;
    line-height:1.5;font-weight:500;
  }
  .source li:first-child{border-top:none;}
  .source li .subj{color:var(--c);font-weight:700;}
  .source li .hrs{
    display:inline-block;background:#ece4d6;color:#7a7060;border-radius:10px;
    padding:1px 8px;font-size:.78rem;margin-left:4px;font-weight:600;
  }
  .source li .det{display:block;color:#857c6c;font-size:.89rem;margin-top:2px;font-weight:400;}

  /* ====== 엔딩 ====== */
  .ending{
    background:var(--ink);color:var(--cream);border-radius:24px;
    padding:34px 26px;margin:40px 0 20px;text-align:center;
    box-shadow:7px 8px 0 var(--c);
  }
  .ending .crown{font-size:3rem;}
  .ending h3{font-size:1.6rem;margin:10px 0;font-weight:800;}
  .ending p{font-size:1.06rem;color:#d8d2e8;font-weight:500;}
  .ending b{font-weight:700;color:#fff;}

  footer{text-align:center;padding:30px 18px 50px;color:#a89f8d;font-weight:600;font-size:.95rem;}
  .src-note{max-width:980px;margin:0 auto;padding:0 18px 26px;text-align:center;color:#b3aa98;font-weight:500;font-size:.92rem;line-height:1.6;}

  @media(max-width:520px){
    .card .emoji{font-size:2.8rem;}
    .story-hero .bigemoji{font-size:4.4rem;}
  }
</style>
</head>
<body>

<div class="bg-deco">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- ============ 메인 화면 ============ -->
<main id="home">
  <header class="hero">
    <span class="badge">팀스파르타 AI 캠퍼스</span>
    <h1>AI 모험가가<br>되는 <span class="pop">5가지 길</span></h1>
    <p>AI를 다루는 다섯 명의 주인공이 있어요.<br>누가 무엇을 배우는지 함께 따라가 볼까요?</p>
    <div class="hint"><span class="arrow">👇</span> 궁금한 주인공을 눌러보세요</div>
  </header>

  <div class="wrap">
    <div class="grid" id="cardGrid"></div>
  </div>

  <p class="src-note">※ 각 단계의 쉬운 이야기 아래에는 「2026 KDT AI Campus 훈련과정 개요서」의 실제 교과 내용을 출처로 함께 적어두었어요.</p>
  <footer>모든 과정은 1516시간 동안 천천히, 끝까지 함께 가요 🐢</footer>
</main>

<!-- ============ 스토리 화면 (JS로 채움) ============ -->
<section class="story" id="storyView"></section>

<script>
/* =========================================================

/* =========================================================
   카드 렌더링
   ========================================================= */
const grid = document.getElementById('cardGrid');
COURSES.forEach((c,i)=>{
  const el = document.createElement('div');
  el.className='card';
  el.tabIndex=0;
  el.style.setProperty('--c',c.color);
  el.style.animationDelay=(i*.06)+'s';
  el.innerHTML=`
    <span class="emoji">${c.emoji}</span>
    <span class="role">${c.role}</span>
    <h2>${c.name}</h2>
    <div class="eng">${c.eng}</div>
    <p class="blurb">${c.blurb}</p>
    <div class="go">이야기 보러가기 <span>→</span></div>`;
  el.addEventListener('click',()=>openStory(c.id));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory(c.id);}});
  grid.appendChild(el);
});

/* =========================================================
   스토리 화면 열기
   ========================================================= */
const home = document.getElementById('home');
const storyView = document.getElementById('storyView');

function openStory(id){
  const c = COURSES.find(x=>x.id===id);
  document.documentElement.style.setProperty('--c',c.color);
  document.documentElement.style.setProperty('--soft',c.soft);

  let stepsHTML='';
  c.steps.forEach((s,idx)=>{
    const srcList = s.source.map(o=>
      `<li><span class="subj">${o.s}</span><span class="hrs">${o.h}</span><span class="det">${o.d}</span></li>`
    ).join('');
    stepsHTML+=`
      <div class="step" style="--c:${c.color};--soft:${c.soft}">
        <div class="step-head" onclick="this.parentNode.classList.toggle('open')">
          <div class="step-num">${idx+1}</div>
          <div class="st-emoji">${s.emoji}</div>
          <div class="st-title"><strong>${s.title}</strong><em>${s.eng}</em></div>
          <div class="chev">▾</div>
        </div>
        <div class="step-body">
          <p class="story-line">${s.story}</p>
          <div class="learn">
            <div class="lh">🎒 이때 배우는 것</div>
            <ul>${s.learn.map(l=>`<li>${l}</li>`).join('')}</ul>
          </div>
          <div class="source">
            <div class="sh">📄 원본 출처 — 개요서 「4. 교과과정 상세」</div>
            <ul>${srcList}</ul>
          </div>
        </div>
      </div>`;
  });

  storyView.innerHTML=`
    <div class="topbar" style="--c:${c.color}">
      <button class="back" onclick="goHome()">← 돌아가기</button>
      <span class="tname">${c.emoji} ${c.name}</span>
    </div>
    <div class="wrap">
      <div class="story-hero" style="--c:${c.color}">
        <span class="bigemoji">${c.emoji}</span>
        <div><span class="role">${c.role}</span></div>
        <h2>${c.name}</h2>
        <div class="sub">${c.eng}</div>
      </div>

      <div class="intro-box" style="--c:${c.color}">
        <span class="tag">이 친구는?</span>
        ${c.intro}
      </div>

      <div class="journey-title" style="--c:${c.color}">
        5단계 성장 모험 🗺️
        <small>각 단계를 눌러 이야기와 원본 교과 출처를 펼쳐보세요</small>
      </div>

      ${stepsHTML}

      <div class="ending" style="--c:${c.color}">
        <div class="crown">🎓</div>
        <h3>모험 완성!</h3>
        <p>다섯 단계를 모두 거치면, 우리 주인공은<br>진짜 <b>${c.name}</b>가 되어 세상으로 나아가요!</p>
      </div>
    </div>
    <footer>다른 주인공도 만나볼까요? 위의 돌아가기를 눌러보세요 ✨</footer>`;

  home.style.display='none';
  storyView.classList.add('active');
  window.scrollTo(0,0);
  setTimeout(()=>{const f=storyView.querySelector('.step');if(f)f.classList.add('open');},250);
}

function goHome(){
  storyView.classList.remove('active');
  storyView.innerHTML='';
  home.style.display='block';
  window.scrollTo(0,0);
}
</script>
